[project]
name = "llm-api-wrapper"
version = "0.1.0"
description = "大模型 API 封装服务 - 支持 Qwen/DeepSeek，含超时、重试、token 计数、结构化输出、上下文裁剪"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "tenacity>=8.3.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "hypothesis>=6.100.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
